/* ---------- hero with canvas particles ---------- */
function Particles(){
  const ref=useRef();
  useEffect(()=>{
    const cv=ref.current,cx=cv.getContext("2d");let w,h,raf;
    const size=()=>{w=cv.width=cv.offsetWidth;h=cv.height=cv.offsetHeight};size();addEventListener("resize",size);
    const n=innerWidth<640?35:70;
    const ps=Array.from({length:n},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*2+.5,v:Math.random()*.4+.15,g:Math.random()<.6}));
    const draw=()=>{cx.clearRect(0,0,w,h);
      for(const p of ps){p.y-=p.v;if(p.y<-5){p.y=h+5;p.x=Math.random()*w}
        cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fillStyle=p.g?"rgba(245,197,66,.7)":"rgba(167,139,250,.6)";cx.fill()}
      raf=requestAnimationFrame(draw)};draw();
    return()=>{cancelAnimationFrame(raf);removeEventListener("resize",size)};
  },[]);
  return <canvas ref={ref} className="absolute inset-0 w-full h-full" aria-hidden="true"/>;
}

/* ---------- events ---------- */
function Events(){
  const [tab,setTab]=useState("upcoming");
  const today=new Date().toISOString().slice(0,10);

/* ---------- KING hub tiles ---------- */
function useCountdown(iso){
  const calc=()=>Math.max(0,new Date(iso)-Date.now());
  const [ms,setMs]=useState(calc);
  useEffect(()=>{const t=setInterval(()=>setMs(calc()),1000);return()=>clearInterval(t)},[]);
  const S=Math.floor(ms/1000);return {d:Math.floor(S/86400),h:Math.floor(S%86400/3600),m:Math.floor(S%3600/60),s:S%60,done:ms===0};
}
const Tile=({title,children,className=""})=>(

    <h3 className="font-head text-xl text-gold uppercase tracking-wide mb-3">{title}</h3>{children}</div>
);

        <h3 className="font-head text-5xl font-bold">KING</h3><p className="text-sm text-white/85">Upcoming · Action thriller</p></article>}
      {list.map((f,i)=><article key={f.t} className="relative aspect-[2/3] rounded-2xl overflow-hidden border border-violet/40 hover:border-gold hover:-translate-y-1 transition p-4 flex flex-col justify-end" style={{background:GRADS[i%4]}}>
        {f.image&&<img src={f.image} alt={f.t+" poster"} loading="lazy" className="absolute inset-0 w-full h-full object-cover"/>}
        <span className="absolute top-3 left-3 font-head text-gold text-lg">{f.y}</span>
        <div className="relative"><h3 className="font-head text-2xl leading-tight uppercase">{f.t}</h3><p className="text-xs text-white/75 mt-1">as {f.r}</p></div></article>)}
    </div>
    <p className="text-xs text-white/45 mt-5">A selection only — see the <a className="text-gold hover:underline" href={SRK_LINKS.filmWiki} target="_blank" rel="noopener noreferrer">complete filmography on Wikipedia</a>. Poster-style tiles are original designs; official posters belong to their studios.</p>
  </Section>;
}

/* ---------- news ---------- */
function News(){
  const [cat,setCat]=useState("All");
  const list=NEWS.filter(n=>cat==="All"||n.category===cat);
  return <Section id="news" kicker="Latest" title="News & Updates" alt>
    <div className="flex flex-wrap gap-2 mb-8">{["All",...NEWS_CATEGORIES].map(c=><Chip key={c} active={cat===c} onClick={()=>setCat(c)}>{c}</Chip>)}</div>
    {list.length===0?<Empty icon="📰" text="No updates posted yet. SRK news, KKR match updates, announcements and community achievements will appear here."/>
    :<div className="grid md:grid-cols-2 lg:grid-cols-3 gap-5">{list.map((n,i)=><article key={i} className="rounded-2xl bg-card border border-violet/30 p-5 hover:border-gold transition">
      <span className="text-xs text-gold uppercase tracking-wider">{n.category} · {n.date}</span>
      <h3 className="font-head text-xl mt-2">{n.title}</h3><p className="text-white/65 text-sm mt-2">{n.summary}</p>
      {n.link&&<a href={n.link} target="_blank" rel="noopener noreferrer" className="inline-block mt-3 text-gold text-sm hover:underline">Read more →</a>}</article>)}</div>}
  </Section>;
}

/* ---------- join form: delivers to SITE.formEmail ---------- */
function Join(){
  const init={name:"",district:"",city:"",mobile:"",email:"",dob:"",why:"",consent:false,site:""};
  const [f,setF]=useState(init);const [touched,setTouched]=useState({});const [status,setStatus]=useState("idle");
  const today=new Date().toISOString().slice(0,10);
  const rules={
    name:v=>v.trim().length<2?"Please enter your full name.":"",
    district:v=>!v?"Select your district.":"",
    city:v=>v.trim().length<2?"Please enter your city or town.":"",
    mobile:v=>!/^[6-9]\d{9}$/.test(v)?"Enter a valid 10-digit Indian mobile number.":"",
    email:v=>!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim())?"Enter a valid email address.":"",
    dob:v=>{if(!v||v>today)return "Enter a valid date of birth.";const a=(Date.now()-new Date(v))/31557600000;return a<13?"You must be at least 13 years old to join.":""},
    why:v=>v.trim().length<10?"Tell us a little more (at least 10 characters).":"",
    consent:v=>!v?"Please agree so we can contact you.":""
  };
  const errors=Object.fromEntries(Object.keys(rules).map(k=>[k,rules[k](f[k])]).filter(([,m])=>m));
  const done=Object.keys(rules).filter(k=>!errors[k]).length, total=Object.keys(rules).length;
  const set=k=>e=>{let v=e.target.type==="checkbox"?e.target.checked:e.target.value;if(k==="mobile")v=v.replace(/\D/g,"").slice(0,10);setF({...f,[k]:v})};
  const blur=k=>()=>setTouched(t=>({...t,[k]:true}));
  const summary=()=>`Full name: ${f.name}\nDistrict: ${f.district}\nCity: ${f.city}\nMobile: +91 ${f.mobile}\nEmail: ${f.email}\nDate of birth: ${f.dob}\nWhy join: ${f.why}`;
  const mailto=()=>"mailto:"+SITE.formEmail+"?subject="+encodeURIComponent("Join request – "+f.name)+"&body="+encodeURIComponent(summary());
  const submit=async ev=>{
    ev.preventDefault();
    if(f.site)return; // honeypot: bots fill this hidden field
    if(Object.keys(errors).length){setTouched(Object.fromEntries(Object.keys(rules).map(k=>[k,true])));
      const first=Object.keys(errors)[0];document.getElementById("jf-"+first)?.focus();return;}
    setStatus("sending");
    try{
      const r=await fetch("https://formsubmit.co/ajax/"+SITE.formEmail,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},
        body:JSON.stringify({name:f.name,district:f.district,city:f.city,mobile:"+91 "+f.mobile,email:f.email,date_of_birth:f.dob,why_join:f.why,_replyto:f.email,_subject:"New SRK Warriors Odisha join request – "+f.name,_template:"table",_captcha:"false"})});
      const j=await r.json();
      if(!r.ok||j.success===false||j.success==="false")throw new Error("send failed");
      setStatus("sent");
    }catch(_){setStatus("fallback")}
  };
  const Field=({k,label,hint,children})=>{const m=touched[k]&&errors[k];
    return <div><label htmlFor={"jf-"+k} className="text-sm text-white/80">{label}<span className="text-gold"> *</span></label>
      <div className="mt-1">{children(!!m)}</div>
      {m?<p role="alert" className="text-red-400 text-xs mt-1">{errors[k]}</p>:hint&&<p className="text-white/40 text-xs mt-1">{hint}</p>}</div>};
  const inp=(k,extra={})=>({id:"jf-"+k,value:f[k],onChange:set(k),onBlur:blur(k),"aria-invalid":!!(touched[k]&&errors[k]),style:touched[k]&&errors[k]?{borderColor:"#f87171"}:undefined,...extra});
  const steps=[["1","Fill the form","Tell us who you are and where you’re from."],["2","We reach out","The team contacts you on your mobile or email."],["3","Join the community","Meet fellow Warriors and take part in fan gatherings."]];
  return <Section id="join" kicker="Become a Warrior" title="Join Our Warriors">
    <div className="grid lg:grid-cols-5 gap-8">
      <aside className="lg:col-span-2 space-y-5">
        <div className="rounded-3xl border border-gold/40 p-6" style={{background:"linear-gradient(160deg,#4c1d95,#150d24 70%)"}}>
          <h3 className="font-head text-2xl gold-text">One King. One Team. One Passion.</h3>
          <p className="text-sm text-white/75 mt-2">Be part of the SRK Warriors Odisha family — SRK fans, KKR supporters and cricket lovers united across the state.</p>
          <ol className="mt-5 space-y-4">{steps.map(([n,t,d])=><li key={n} className="flex gap-3"><span className="shrink-0 grid place-items-center w-8 h-8 rounded-full bg-gold text-ink font-head">{n}</span><span><b className="block">{t}</b><span className="text-sm text-white/65">{d}</span></span></li>)}</ol>
        </div>
        <div className="rounded-2xl bg-card border border-violet/30 p-5 text-sm space-y-2">
          <p className="font-head text-lg text-gold">Prefer to talk?</p>
          <p>📞 <a className="hover:text-gold underline" href={"tel:"+SITE.phone}>{SITE.phoneDisplay}</a></p>
          <p>✉️ <a className="hover:text-gold underline" href={"mailto:"+SITE.formEmail}>{SITE.formEmail}</a></p>
          {SITE.whatsapp&&<p>💬 <a className="hover:text-gold underline" href={SITE.whatsapp} target="_blank" rel="noopener noreferrer">Join our WhatsApp community</a></p>}
        </div>
      </aside>
      <div className="lg:col-span-3 rounded-3xl bg-card border border-gold/40 p-6 md:p-8">
        {status==="sent"||status==="fallback"?<div className="text-center py-6" role="status" aria-live="polite">
          <div className="text-5xl">{status==="sent"?"🎉":"✉️"}</div>
          <h3 className="font-head text-3xl gold-text mt-2">{status==="sent"?`Welcome, ${f.name.trim().split(" ")[0]}!`:"One last step"}</h3>
          {status==="sent"?<p className="text-white/75 mt-2">Your request has reached the SRK Warriors Odisha team. We’ll contact you soon.</p>
          :<><p className="text-white/75 mt-2">We couldn’t send your request automatically from here. Tap the button below — your email app opens with everything filled in; just press <b>Send</b>.</p>
            <div className="mt-5 flex flex-wrap gap-3 justify-center"><Btn href={mailto()}>Send by email</Btn><Btn href={"tel:"+SITE.phone} variant="ghost">Call {SITE.phoneDisplay}</Btn></div></>}
          <div className="mt-6"><Btn variant="ghost" onClick={()=>{setF(init);setTouched({});setStatus("idle")}}>Submit another request</Btn></div>
        </div>
        :<form onSubmit={submit} noValidate className="grid gap-5">
          <div><div className="flex justify-between text-xs text-white/50 mb-1"><span>Your details</span><span>{done} of {total} complete</span></div>
            <div className="h-1.5 rounded-full bg-white/10 overflow-hidden"><div className="h-full bg-gold transition-all" style={{width:(done/total*100)+"%"}}/></div></div>
          <Field k="name" label="Full name">{()=><input {...inp("name",{autoComplete:"name",placeholder:"Your full name"})}/>}</Field>
          <div className="grid sm:grid-cols-2 gap-5">
            <Field k="district" label="District">{()=><select {...inp("district",{autoComplete:"address-level1"})}><option value="">Select district…</option>{DISTRICTS.map(d=><option key={d}>{d}</option>)}</select>}</Field>
            <Field k="city" label="City / town">{()=><input {...inp("city",{autoComplete:"address-level2",placeholder:"e.g. your town"})}/>}</Field>
            <Field k="mobile" label="Mobile number" hint="10-digit number without +91">{()=><div className="flex"><span className="grid place-items-center px-3 rounded-l-[.6rem] border border-r-0 border-[#3b2a5c] bg-[#1a0f2b] text-white/70 text-sm">+91</span><input {...inp("mobile",{type:"tel",inputMode:"numeric",autoComplete:"tel-national",maxLength:10,style:{borderTopLeftRadius:0,borderBottomLeftRadius:0,...(touched.mobile&&errors.mobile?{borderColor:"#f87171"}:{})}})}/></div>}</Field>
            <Field k="email" label="Email address">{()=><input {...inp("email",{type:"email",autoComplete:"email",placeholder:"you@example.com"})}/>}</Field>
          </div>
          <Field k="dob" label="Date of birth">{()=><input {...inp("dob",{type:"date",max:today,autoComplete:"bday"})}/>}</Field>
          <Field k="why" label="Why do you want to join?" hint={f.why.trim().length+" / 500"}>{()=><textarea {...inp("why",{rows:4,maxLength:500,placeholder:"Tell us about your love for SRK, KKR and cricket…"})}/>}</Field>
          <input type="text" name="site" value={f.site} onChange={set("site")} tabIndex={-1} autoComplete="off" aria-hidden="true" className="hidden"/>
          <div><label className="flex gap-3 items-start text-sm text-white/75 cursor-pointer"><input id="jf-consent" type="checkbox" checked={f.consent} onChange={set("consent")} onBlur={blur("consent")} style={{width:"1.1rem",height:"1.1rem",marginTop:".15rem",padding:0}}/>
            <span>I agree to be contacted by SRK Warriors Odisha about my membership. My details are emailed to the organisers only.</span></label>
            {touched.consent&&errors.consent&&<p role="alert" className="text-red-400 text-xs mt-1">{errors.consent}</p>}</div>
          <button type="submit" disabled={status==="sending"} className="inline-flex items-center justify-center rounded-full px-6 py-3 font-semibold bg-gold text-ink transition hover:-translate-y-0.5 glow disabled:opacity-60">{status==="sending"?"Sending…":"Join the Warriors ♛"}</button>
        </form>}
      </div>
    </div>
  </Section>;
}

/* ---------- contact / community ---------- */
function Contact(){
  return <Section id="contact" kicker="Say hello" title="Contact Us" alt>
    <div className="grid md:grid-cols-2 gap-6">
      <div className="rounded-2xl bg-card border border-violet/30 p-6 space-y-3">
        <p>📍 {SITE.location}</p>
        <p>✉️ {SITE.email?<a className="text-gold" href={"mailto:"+SITE.email}>{SITE.email}</a>:<span className="text-white/50">Email coming soon</span>}</p>
        <p>📞 <a className="text-gold" href={"tel:"+SITE.phone}>{SITE.phoneDisplay}</a></p>
        <Social s={SITE}/>
      </div>
      <div className="rounded-2xl bg-gradient-to-br from-royal/60 to-card border border-gold/40 p-6">
        <h3 className="font-head text-2xl">Join our WhatsApp community</h3>
        <p className="text-white/70 text-sm mt-2 mb-4">Get match-day alerts, event news and chat with fellow Warriors.</p>
        {SITE.whatsapp?<Btn href={SITE.whatsapp}>Join on WhatsApp</Btn>:<><Btn disabled>WhatsApp link coming soon</Btn><p className="text-xs text-white/40 mt-2">Set SITE.whatsapp to enable.</p></>}
      </div>
    </div>
  </Section>;
}

function Footer(){
  return <footer className="border-t border-violet/30 bg-ink px-5 py-12" style={{paddingBottom:"calc(3rem + env(safe-area-inset-bottom,0px))"}}>
    <div className="max-w-6xl mx-auto grid md:grid-cols-3 gap-8">
      <div><Logo/><p className="text-white/60 text-sm mt-3">An independent fan community uniting fans across Odisha through Shah Rukh Khan, KKR and cricket.</p><Social s={SITE} className="mt-3"/></div>
      <div><h4 className="font-head text-gold mb-3">Quick links</h4><ul className="grid grid-cols-2 gap-1 text-sm">{NAV.map(([n,id])=><li key={id}><a href={"#"+id} className="text-white/70 hover:text-gold">{n}</a></li>)}</ul></div>
      <div><h4 className="font-head text-gold mb-3">Contact</h4><p className="text-sm text-white/70">{SITE.location}</p>{SITE.email&&<p className="text-sm text-white/70">{SITE.email}</p>}<p className="text-sm text-white/70"><a href={"tel:"+SITE.phone} className="hover:text-gold">📞 {SITE.phoneDisplay}</a></p></div>
    </div>
    <p className="max-w-6xl mx-auto text-xs text-white/40 mt-10 border-t border-white/10 pt-5">© {new Date().getFullYear()} SRK Warriors Odisha. All rights reserved. Not affiliated with Shah Rukh Khan, Red Chillies Entertainment or Kolkata Knight Riders. All names and marks belong to their respective owners.</p>
  </footer>;
}

function App(){
  return <><Nav/><main><Hero/><KingHub/><About/><Gallery/><Events/><Films/><News/><Join/><Contact/></main><Footer/></>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
